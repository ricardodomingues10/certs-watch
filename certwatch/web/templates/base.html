<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}certwatch{% endblock %} · certwatch</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">cert<span>watch</span></a>
  <nav>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Painel</a>
    <a href="/certificados" class="{{ 'on' if p.startswith('/certificados') }}">Certificados</a>
    <a href="/findings" class="{{ 'on' if p.startswith('/findings') }}">Findings</a>
    <a href="/endpoints" class="{{ 'on' if p.startswith('/endpoints') }}">Endpoints</a>
    <a href="/jobs" class="{{ 'on' if p.startswith('/jobs') }}">Jobs e auditoria</a>
  </nav>
  <span class="who">{{ user }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>certwatch {{ version }} · datas em hora de Lisboa</footer>
</body>
</html>
