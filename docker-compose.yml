# certwatch — ambiente de teste no servidor de testes.
#
# web e worker usam a rede do host (network_mode: host) para terem exatamente
# a mesma conectividade e DNS que o servidor (cmdb.exemplo.local, endpoints internos).
# A interface web só escuta em 127.0.0.1 — aceder por túnel SSH (ver README).

name: certwatch

x-app: &app
  build: .
  image: certwatch:0.13.1
  network_mode: host
  restart: unless-stopped
  env_file: .env
  secrets: [db_password, ucmdb_user, ucmdb_password, admin_password, smax_user, smax_password, smtp_password, publish_ssh]
  volumes:
    - ./trust:/app/trust:ro
    - ./import:/app/import:ro
    # Pasta de rede da UCMDB (montada no servidor). Sem CERTWATCH_PUBLISH_HOST_DIR usa ./publicar
    - ${CERTWATCH_PUBLISH_HOST_DIR:-./publicar}:/app/publicar
  group_add: ["${CERTWATCH_PUBLISH_GID:-10001}"]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certwatch
      POSTGRES_USER: certwatch
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certwatch -d certwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  worker:
    <<: *app
    command: ["python", "-m", "certwatch.worker"]

  web:
    <<: *app
    command: ["python", "-m", "uvicorn", "certwatch.web.app:app",
              "--host", "127.0.0.1", "--port", "8088", "--proxy-headers", "--no-server-header"]
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

secrets:
  db_password:
    file: ./secrets/db_password
  ucmdb_user:
    file: ./secrets/ucmdb_user
  ucmdb_password:
    file: ./secrets/ucmdb_password
  admin_password:
    file: ./secrets/admin_password
  # SMAX (opcional): se não for usado, criar os ficheiros vazios (touch secrets/smax_user secrets/smax_password)
  smax_user:
    file: ./secrets/smax_user
  smax_password:
    file: ./secrets/smax_password
  # Email (opcional): password do servidor SMTP; se não houver autenticação, criar o ficheiro vazio
  # (touch secrets/smtp_password)
  smtp_password:
    file: ./secrets/smtp_password
  # Publicação por SFTP noutro servidor (opcional): chave privada SSH dedicada (recomendado) ou password.
  # Vazio = a password é pedida na página em cada publicação e nunca guardada. (touch secrets/publish_ssh)
  publish_ssh:
    file: ./secrets/publish_ssh

volumes:
  pgdata:
